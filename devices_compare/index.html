        // --- 輔助函式：風險判讀 ---
        const analyzeRisk = (rawText) => {
            if (rawText === null || rawText === undefined) return { level: 'unknown', color: 'bg-gray-100 text-gray-400' };
            const text = String(rawText);
            const lower = text.toLowerCase();
            // Critical
            if (lower.includes('不均勻') || lower.includes('嚴重') || lower.includes('手動微調') || lower.includes('對位不易') || lower.includes('失效') || lower.includes('high risk') || lower.includes('not fixed') || lower.includes('issue') || lower.includes('fail')) {
                return { level: 'critical', color: 'bg-red-50 text-red-700 border-red-200 ring-1 ring-red-100' };
            }
            // Warning
            if (lower.includes('殘留') || lower.includes('影響') || lower.includes('暗角') || lower.includes('需注意') || lower.includes('warning')) {
                return { level: 'warning', color: 'bg-yellow-50 text-yellow-700 border-yellow-200 ring-1 ring-yellow-100' };
            }
            // Stable
            if (lower.includes('無') || lower.includes('均勻') || lower.includes('自動') || lower.includes('標準') || lower.includes('優化') || lower.includes('pass') || lower.includes('fixed') || lower.includes('solved')) {
                return { level: 'stable', color: 'bg-green-50 text-green-700 border-green-200 ring-1 ring-green-100' };
            }
            return { level: 'info', color: 'bg-slate-50 text-slate-600 border-slate-200' };
        };

                        return (

                                                    <tr>
                                                        <th className="p-4 bg-slate-50 border-r border-slate-200 sticky left-0 top-0 z-50 min-w-[200px] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                                                            規格項目 / 機台
                                                        </th>
                                                        {visibleMachines.map(m => (
                                                            <th key={m.id} className="p-4 min-w-[220px] border-r border-slate-100 bg-slate-50 sticky top-0 z-40">
                                                                <div className="flex flex-col">
                                                                    <span className="text-slate-800 text-base">{m.name}</span>
                                                                    <span className="text-[10px] text-slate-400 font-mono mt-0.5">{m.id}</span>
                                                                    <span className={`mt-1 inline-flex w-fit px-1.5 py-0.5 rounded text-[10px] uppercase ${m.series === 'Alpha' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-500'}`}>
                                                                        {m.series}
                                                                    </span>
                                                                </div>
                                                            </th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {visibleRows.map((row, rIdx) => {
                                                        if (row.isSection) {
                                                            return (
                                                                <tr key={rIdx} className="bg-slate-100/80">
                                                                    <td colSpan={visibleMachines.length + 1} className="p-3 text-sm font-bold text-slate-700 border-y border-slate-200 sticky left-0 z-10">
                                                                        {row.key}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        }
                                                        const values = visibleMachines.map(m => String(row.values[m.id] || '').trim());
                                                        const hasDiff = new Set(values).size > 1;

                                                        return (
                                                            <tr key={rIdx} className={`transition-colors ${hasDiff ? 'bg-orange-50/30' : 'hover:bg-slate-50/50'}`}>
                                                                <td className={`p-4 text-sm border-r border-slate-200 sticky left-0 z-10 align-top ${hasDiff ? 'text-orange-700 bg-orange-50 font-bold' : 'text-slate-600 font-medium bg-white'}`}>
                                                                    <div className="flex items-start justify-between">
                                                                        <span>
                                                                            {row.key}
                                                                            {row.isImportant && <span className="ml-1 text-blue-500" title="重點項目">★</span>}
                                                                        </span>
                                                                        {hasDiff && <span className="text-orange-400 text-xs ml-1">•</span>}
                                                                    </div>
                                                                </td>
                                                                {visibleMachines.map(m => (
                                                                    <td key={`${m.id}-${rIdx}`} className="p-4 border-r border-slate-100 align-top">
                                                                        <RiskCard text={row.values[m.id]} />
                                                                    </td>
                                                                ))}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {/* --- VIEW 2: Diff --- */}
                                {activeTab === 'compare' && (
                                    <div className="space-y-6">
                                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-6 justify-center">
                                            {[
                                                { label: '基準機台', val: compareA, set: setCompareA },
                                                { label: '比較對象', val: compareB, set: setCompareB }
                                            ].map((ctrl, idx) => (
                                                <div key={idx} className="w-full md:w-1/3">
                                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{ctrl.label}</label>
                                                    <select value={ctrl.val} onChange={e => ctrl.set(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                                                        {machines.map(m => <option key={m.id} value={m.id}>{m.id} ({m.name})</option>)}
                                                    </select>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="grid md:grid-cols-2 gap-6">
                                            {[compareA, compareB].map((id, idx) => {
                                                const machine = machines.find(m => m.id === id);
                                                if (!machine) return null;
                                                const isBase = idx === 0;
                                                const peerId = isBase ? compareB : compareA;

                                                return (
                                                    <div key={id} className={`bg-white rounded-xl shadow-sm border overflow-hidden ${isBase ? 'border-slate-200' : 'border-blue-200 ring-1 ring-blue-50'}`}>
                                                        <div className={`p-4 border-b ${isBase ? 'bg-slate-50' : 'bg-blue-50/50'}`}>
                                                            <h3 className="font-bold text-lg text-slate-800">{machine.name}</h3>
                                                            <p className="text-xs text-slate-500">{machine.id}</p>
                                                        </div>
                                                        <div className="divide-y divide-slate-50">
                                                            {specRows.filter(r => !r.isSection).map(r => {
                                                                const val = String(r.values[id] || '').trim();
                                                                const peerVal = String(r.values[peerId] || '').trim();
                                                                const isDiff = !isBase && val !== peerVal;

                                                                if (viewMode === 'summary') {
                                                                    const keywords = ['熱', '光', '殘留', '清潔', 'Risk', '問題', 'Issue'];
                                                                    // Show if: keyword matched OR isImportant OR after knownRiskIndex
                                                                    const isRisk = r.key.includes('已知風險'); // Simplified check for now
                                                                    if (!r.isImportant && !keywords.some(k => r.key.includes(k)) && !isRisk) return null;
                                                                }

                                                                return (
                                                                    <div key={r.key} className={`p-4 ${isDiff ? 'bg-yellow-50/30' : ''}`}>
                                                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex justify-between">
                                                                            <span>
                                                                                {r.key}
                                                                                {r.isImportant && <span className="ml-1 text-blue-500">★</span>}
                                                                            </span>
                                                                            {isDiff && <span className="text-yellow-600 bg-yellow-100 px-1.5 rounded text-[10px]">DIFFERENT</span>}
                                                                        </div>
                                                                        <RiskCard text={r.values[id]} />
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </main>
                </div >
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
