        // --- 輔助函式：風險判讀 ---
        const analyzeRisk = (rawText) => {
            if (rawText === null || rawText === undefined) return { level: 'unknown', variant: 'neutral' };
            const text = String(rawText);
            const lower = text.toLowerCase();

            // Critical
            if (lower.includes('不均勻') || lower.includes('嚴重') || lower.includes('手動微調') || lower.includes('對位不易') || lower.includes('失效') || lower.includes('high risk') || lower.includes('not fixed') || lower.includes('issue') || lower.includes('fail') || lower.includes('漏液')) {
                return { level: 'critical', variant: 'danger', icon: AlertOctagon };
            }
            // Warning
            if (lower.includes('殘留') || lower.includes('影響') || lower.includes('暗角') || lower.includes('需注意') || lower.includes('warning') || lower.includes('誤差')) {
                return { level: 'warning', variant: 'warning', icon: AlertTriangle };
            }
            // Stable
            if (lower.includes('無') || lower.includes('均勻') || lower.includes('自動') || lower.includes('標準') || lower.includes('優化') || lower.includes('pass') || lower.includes('fixed') || lower.includes('solved') || lower.includes('正常')) {
                return { level: 'stable', variant: 'success', icon: CheckCircle };
            }
            return { level: 'info', variant: 'neutral', icon: null };
        };

            if (text === null || text === undefined || String(text).trim() === '') return <span className="text-slate-300 text-xs">-</span>;

            if (lines.length === 0) return <span className="text-slate-800 text-sm">{strText}</span>;

            return (
                <div className="flex flex-col gap-1.5 items-start">

                        const { variant, icon: IconComponent } = analyzeRisk(line);

                        let styleClass = "bg-slate-50 text-slate-700 border-slate-200";
                        if (variant === 'danger') styleClass = "bg-red-50 text-red-700 border-red-200";
                        if (variant === 'warning') styleClass = "bg-amber-50 text-amber-700 border-amber-200";
                        if (variant === 'success') styleClass = "bg-emerald-50 text-emerald-700 border-emerald-200";

                        return (
                            <div key={idx} className={`text-xs px-2.5 py-1.5 rounded-md border ${styleClass} inline-flex items-start gap-1.5 leading-tight max-w-full break-words`}>

                                <span>{line}</span>
                            </div>
                        );
                    })}

                // Collect Values
                let isRowEmpty = true;
                const values = {};
                extractedMachines.forEach(m => {
                    const val = rowData[m.colIndex];
                    if (val !== undefined && val !== null && String(val).trim() !== '') {
                        isRowEmpty = false;
                    }
                    values[m.id] = val;
                });

                // Determine if Section Header
                // Definition: Key exists, but All Values Empty.
                // Special case: if isRowEmpty is true, we treat it as section header.
                if (isRowEmpty) {
                    // Push old section if it has rows
                    if (currentSection.rows.length > 0) {
                        extractedSections.push(currentSection);
                    }
                    // Start new section
                    currentSection = { title: key, rows: [] };
                } else {
                    currentSection.rows.push({ key, values, isImportant });
                }
            }
            // Push last section
            if (currentSection.rows.length > 0) {
                extractedSections.push(currentSection);
            }

            setMachines(extractedMachines);
            setSections(extractedSections);

            if (extractedMachines.length >= 2) {
                setCompareA(extractedMachines[0].id);
                setCompareB(extractedMachines[1].id);
            }
        };

        const visibleMachines = selectedSeries === 'All' ? machines : machines.filter(m => m.series === selectedSeries);
        const seriesList = ['All', ...new Set(machines.map(m => m.series))];

        return (
            <div className="min-h-screen bg-slate-50 pb-20 font-sans text-slate-900">
                {/* Header */}
                <div className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                    <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-4">
                            <div className="p-2 bg-blue-600 rounded-lg shadow-lg shadow-blue-200">
                                <FileSpreadsheet className="text-white w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-slate-800">機台規格與風險看板</h1>
                                <p className="text-xs text-slate-400">v3.2 Advanced Edition</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="bg-slate-100 p-1 rounded-lg flex text-sm font-medium">
                                <button onClick={() => setActiveTab('heatmap')} className={`px-3 py-2 rounded-md transition-all flex items-center gap-2 ${activeTab === 'heatmap' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <LayoutList size={16} /> 風險熱圖
                                </button>
                                <button onClick={() => setActiveTab('compare')} className={`px-3 py-2 rounded-md transition-all flex items-center gap-2 ${activeTab === 'compare' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Columns size={16} /> 差異比對
                                </button>
                            </div>

                            <label className="flex items-center gap-2 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg cursor-pointer hover:bg-blue-100 transition-colors font-medium text-sm border border-blue-100">
                                <Search size={16} />
                                {fileName ? "更換檔案" : "匯入 Excel"}
                                <input type="file" onChange={handleFileUpload} accept=".xlsx,.xls,.csv" className="hidden" />
                            </label>
                        </div>
                    </div>
                </div>

                <main className="max-w-screen-2xl mx-auto px-4 sm:px-6 mt-6 fade-in">

                    {/* --- VIEW 1: Heatmap --- */}
                    {activeTab === 'heatmap' && (
                        <>
                            {/* Controls */}
                            <div className="mb-4 flex gap-4 items-center justify-between sticky top-20 z-40 bg-slate-50 py-2">
                                <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-hide">
                                    <div className="flex items-center gap-1 text-slate-500 text-sm font-medium mr-2">
                                        <Filter size={14} /> 系列:
                                    </div>
                                    {seriesList.map(series => (
                                        <button key={series} onClick={() => setSelectedSeries(series)}
                                            className={`px-3 py-1 text-sm rounded-full whitespace-nowrap transition-colors border ${selectedSeries === series ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}`}>
                                            {series}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-2 text-sm">
                                    <button onClick={expandAll} className="px-3 py-1.5 bg-white border border-slate-200 rounded text-slate-600 hover:bg-slate-50">全部展開</button>
                                    <button onClick={collapseAll} className="px-3 py-1.5 bg-white border border-slate-200 rounded text-slate-600 hover:bg-slate-50">全部收合</button>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl border border-slate-200 shadow-xl shadow-slate-200/50 overflow-hidden flex flex-col h-[calc(100vh-180px)]">
                                <div className="overflow-auto custom-scrollbar h-full relative">
                                    <table className="w-full text-left border-collapse min-w-max">
                                        <thead className="bg-slate-50 text-slate-500 text-xs uppercase font-bold sticky top-0 z-[60] shadow-sm">
                                            <tr>
                                                <th className="p-4 bg-slate-50 border-r border-slate-200 sticky left-0 top-0 z-[70] min-w-[240px] sticky-col-shadow">
                                                    規格項目
                                                </th>
                                                {visibleMachines.map(m => (
                                                    <th key={m.id} className="p-4 min-w-[260px] border-r border-slate-100 bg-slate-50">
                                                        <div className="flex flex-col">
                                                            <span className="text-slate-800 text-base font-bold">{m.name}</span>
                                                            <span className="text-[10px] text-slate-400 font-mono mt-0.5">{m.id}</span>
                                                            <span className={`mt-1 inline-flex w-fit px-1.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider ${m.series === 'Alpha' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-500'}`}>
                                                                {m.series}
                                                            </span>
                                                        </div>
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {sections.map((section, sIdx) => {
                                                const isCollapsed = collapsedSections.has(section.title);
                                                return (
                                                    <Fragment key={sIdx}>
                                                        {/* Section Header */}
                                                        <tr
                                                            onClick={() => toggleSection(section.title)}
                                                            className="bg-slate-100/80 hover:bg-slate-200/80 cursor-pointer transition-colors sticky top-[73px] z-[50] group"
                                                        >
                                                            <td colSpan={visibleMachines.length + 1} className="p-2 border-y border-slate-200">
                                                                <div className="flex items-center gap-2 px-2 font-bold text-slate-700">
                                                                    {isCollapsed ? <ChevronRight size={18} /> : <ChevronDown size={18} />}
                                                                    {section.title}
                                                                    <span className="text-xs font-normal text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-200 group-hover:border-slate-300">
                                                                        {section.rows.length} 項目
                                                                    </span>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        {/* Rows */}
                                                        {!isCollapsed && section.rows.map((row, rIdx) => {
                                                            const values = visibleMachines.map(m => String(row.values[m.id] || '').trim());
                                                            const hasDiff = new Set(values).size > 1;

                                                            return (
                                                                <tr key={rIdx} className="hover:bg-blue-50/30 transition-colors group/row">
                                                                    <td className="p-4 text-sm border-r border-slate-200 sticky left-0 z-30 align-top bg-white group-hover/row:bg-blue-50/10 sticky-col-shadow">
                                                                        <div className="flex items-start justify-between font-medium text-slate-600">
                                                                            <span>
                                                                                {row.key}
                                                                                {row.isImportant && <span className="ml-1 text-amber-500 text-xs align-top">★</span>}
                                                                            </span>
                                                                            {hasDiff && (
                                                                                <div className="w-1.5 h-1.5 rounded-full bg-amber-400 mt-1.5" title="有差異"></div>
                                                                            )}
                                                                        </div>
                                                                    </td>
                                                                    {visibleMachines.map(m => (
                                                                        <td key={`${m.id}-${rIdx}`} className={`p-3 border-r border-slate-50 align-top ${hasDiff ? 'bg-amber-50/10' : ''}`}>
                                                                            <RiskCard text={row.values[m.id]} />
                                                                        </td>
                                                                    ))}
                                                                </tr>
                                                            );
                                                        })}
                                                    </Fragment>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                    )}

                    {/* --- VIEW 2: Comparison --- */}
                    {activeTab === 'compare' && (
                        <div className="space-y-6 pb-24">
                            {/* Compare Controls */}
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-8 items-end justify-center sticky top-24 z-30">
                                <div className="flex-1 w-full relative">
                                    <div className="absolute -top-3 left-3 bg-white px-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Base Machine</div>
                                    <select value={compareA} onChange={e => setCompareA(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                                        {machines.map(m => <option key={m.id} value={m.id}>{m.name} ({m.id})</option>)}
                                    </select>
                                </div>

                                <div className="bg-slate-100 rounded-full p-2 text-slate-400">
                                    <Columns size={20} />
                                </div>

                                <div className="flex-1 w-full relative">
                                    <div className="absolute -top-3 left-3 bg-white px-2 text-xs font-bold text-blue-500 uppercase tracking-wider">Comparison Target</div>
                                    <select value={compareB} onChange={e => setCompareB(e.target.value)} className="w-full p-3 bg-blue-50 border border-blue-200 rounded-lg text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-blue-900">
                                        {machines.map(m => <option key={m.id} value={m.id}>{m.name} ({m.id})</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="flex justify-center">
                                <label className="flex items-center gap-3 cursor-pointer select-none bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm hover:border-slate-300 transition-all">
                                    <div className={`w-10 h-6 rounded-full p-1 transition-colors duration-200 ease-in-out ${diffOnly ? 'bg-blue-600' : 'bg-slate-200'}`}>
                                        <div className={`w-4 h-4 bg-white rounded-full shadow-sm transform transition-transform duration-200 ease-in-out ${diffOnly ? 'translate-x-4' : 'translate-x-0'}`} />
                                    </div>
                                    <span className="text-sm font-medium text-slate-700">只顯示差異項目 (Show Differences Only)</span>
                                    <input type="checkbox" className="hidden" checked={diffOnly} onChange={e => setDiffOnly(e.target.checked)} />
                                </label>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {[compareA, compareB].map((id, idx) => {
                                    const machine = machines.find(m => m.id === id);
                                    if (!machine) return null;
                                    const isBase = idx === 0;
                                    const peerId = isBase ? compareB : compareA;

                                    const borderColor = isBase ? 'border-slate-200' : 'border-blue-200';
                                    const checkColor = isBase ? 'bg-slate-50' : 'bg-blue-50';

                                    return (
                                        <div key={`${id}-${idx}`} className={`bg-white rounded-xl shadow-lg border ${borderColor} overflow-hidden flex flex-col`}>
                                            <div className={`p-5 border-b ${isBase ? 'bg-slate-50 border-slate-100' : 'bg-blue-50 border-blue-100'} sticky top-0 z-20`}>
                                                <h3 className="font-bold text-xl text-slate-800">{machine.name}</h3>
                                                <div className="flex gap-2 mt-2">
                                                    <span className="text-xs px-2 py-0.5 bg-white border rounded text-slate-500 font-mono">{machine.id}</span>
                                                    <span className="text-xs px-2 py-0.5 bg-white border rounded text-slate-500">{machine.series}</span>
                                                </div>
                                            </div>

                                            <div className="divide-y divide-slate-50">
                                                {sections.map(section => {
                                                    // Filter rows in this section
                                                    const visibleRows = section.rows.filter(r => {
                                                        if (!diffOnly) return true;
                                                        const val = String(r.values[id] || '').trim();
                                                        const peerVal = String(r.values[peerId] || '').trim();
                                                        return val !== peerVal;
                                                    });

                                                    if (visibleRows.length === 0) return null;

                                                    return (
                                                        <div key={section.title}>
                                                            <div className="bg-slate-50/50 px-5 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">{section.title}</div>
                                                            {visibleRows.map(r => {
                                                                const val = String(r.values[id] || '').trim();
                                                                const peerVal = String(r.values[peerId] || '').trim();
                                                                const isDiff = !isBase && val !== peerVal;

                                                                return (
                                                                    <div key={r.key} className={`p-5 ${isDiff ? 'bg-amber-50/40' : ''}`}>
                                                                        <div className="text-xs font-semibold text-slate-500 mb-2 flex justify-between items-center">
                                                                            <span>{r.key} {r.isImportant && '★'}</span>
                                                                            {isDiff && <span className="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">DIFF</span>}
                                                                        </div>
                                                                        <RiskCard text={r.values[id]} />
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    );
                                                })}
                                                {diffOnly && sections.every(s => s.rows.every(r => String(r.values[id] || '').trim() === String(r.values[peerId] || '').trim())) && (
                                                    <div className="p-10 text-center text-slate-400">
                                                        <CheckCircle className="w-12 h-12 mx-auto mb-2 opacity-20" />
                                                        <p>完全一致</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </main>
            </div>
        );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
